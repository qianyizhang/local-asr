name: zh_medical_funasr_qwen_judge
description: Offline FunASR pipeline with local Qwen semantic transcript judgment.
output_dir: outputs/benchmarks
components:
  - kind: media
    name: local
    options:
      sample_rate: 16000
      channels: 1
  - kind: asr
    name: funasr
    options:
      model: models/funasr_sensevoice_small/iic/SenseVoiceSmall
      hotwords_path: resources/hotwords.zh-medical.txt
  - kind: postprocess
    name: sensevoice_tags
  - kind: postprocess
    name: literal_corrections
    options:
      corrections_path: resources/corrections.zh-medical.tsv
  - kind: review
    name: blacklist
    options:
      blacklist_path: resources/blacklist.zh-medical.txt
  - kind: metric
    name: transcript
  - kind: judge
    name: semantic_llm
    options:
      provider: qwen
      runtime: llama_cpp
      model_path: models/qwen3_6_35b_a3b_gguf/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf
      executable: llama-cli
      max_new_tokens: 256
      temperature: 0.0
