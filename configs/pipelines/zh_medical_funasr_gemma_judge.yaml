name: zh_medical_funasr_gemma_judge
description: Offline FunASR pipeline with local Gemma semantic transcript judgment.
output_dir: outputs/benchmarks
components:
  - kind: media
    name: local
    options:
      sample_rate: 16000
      channels: 1
  - kind: asr
    name: funasr
    options:
      model: models/funasr_sensevoice_small/iic/SenseVoiceSmall
      hotwords_path: resources/hotwords.zh-medical.txt
  - kind: postprocess
    name: sensevoice_tags
  - kind: postprocess
    name: literal_corrections
    options:
      corrections_path: resources/corrections.zh-medical.tsv
  - kind: review
    name: blacklist
    options:
      blacklist_path: resources/blacklist.zh-medical.txt
  - kind: metric
    name: transcript
  - kind: judge
    name: semantic_llm
    options:
      provider: gemma
      runtime: transformers
      model_path: models/gemma3_270m_it
      max_new_tokens: 256
