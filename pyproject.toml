[project]
name = "local-speech-lab"
version = "0.1.0"
description = "Local wake-word, Chinese ASR, and medical-domain speech experiments."
requires-python = ">=3.10,<3.13"
dependencies = [
  "funasr>=1.1.0",
  "huggingface-hub>=0.23.0",
  "modelscope>=1.14.0",
  "numpy>=1.24.0",
  "onnxruntime>=1.17.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "sherpa-onnx>=1.10.0",
  "sounddevice>=0.5.0",
  "soundfile>=0.12.1",
  "typer>=0.12.0",
]

[project.optional-dependencies]
ui = [
  "gradio>=4.0.0",
]
vad = [
  "silero-vad>=5.1.0",
]
llm = [
  "transformers>=4.51.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:.*SwigPy.*:DeprecationWarning",
  "ignore:.*swigvarlink.*:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
